name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout senza submoduli
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Scarica MPVKit a mano
        # Il meccanismo dei submoduli e' rotto in questo repo (libass-android
        # e mpvEx non hanno url in .gitmodules). MPVKit lo cloniamo diretto,
        # al commit a cui il progetto e' agganciato.
        run: |
          rm -rf MPVKit
          git clone https://github.com/NuvioMedia/MPVKit.git MPVKit
          cd MPVKit
          git checkout 20afe97c34e46fce08a3794e2afa64613ea62794
          cd ..
          echo "--- contenuto di MPVKit ---"
          ls -la MPVKit | head -n 20

      - name: Java per la parte Kotlin Multiplatform
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Versione di Xcode in uso
        run: xcodebuild -version

      - name: Compila senza firma
        env:
          NUVIO_IOS_DISTRIBUTION: full
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Riepilogo degli errori
        # Gira comunque, anche se la compilazione fallisce
        if: always()
        run: |
          echo "=============== RIGHE DI ERRORE ==============="
          grep -n "error:" build.log | tail -n 40 || echo "nessuna riga con 'error:'"
          echo "=============== ULTIME 40 RIGHE ==============="
          tail -n 40 build.log

      - name: Salva il log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Impacchetta in .ipa
        run: |
          set -e
          APP_PATH=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Trovato: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Nuvio-unsigned.ipa Payload

      - name: Leggi bundle ID e versione
        run: |
          PLIST=$(find Payload -maxdepth 2 -name "Info.plist" | head -n 1)
          echo "--- dati per Apple Developer e manifest.plist ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"         "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion"            "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion"           "$PLIST"
          echo "--- estensioni presenti (se vuoto, nessuna) ---"
          ls Payload/*.app/PlugIns 2>/dev/null || echo "nessuna"

      - name: Pubblica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-unsigned-ipa
          path: Nuvio-unsigned.ipa
          retention-days: 30
