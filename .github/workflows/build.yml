name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout senza submoduli
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Scarica solo i submoduli che servono a iOS
        # libass-android e mpvEx sono submoduli Android registrati male:
        # se li tocchi, git si ferma. Prendiamo solo MPVKit.
        run: |
          git submodule init MPVKit || echo "MPVKit non registrato, proseguo"
          git submodule update --depth 1 MPVKit || echo "MPVKit non scaricato, proseguo"
          echo "--- stato submoduli ---"
          git submodule status || true

      - name: Java per la parte Kotlin Multiplatform
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Versione di Xcode in uso
        run: xcodebuild -version

      - name: Compila senza firma
        env:
          NUVIO_IOS_DISTRIBUTION: full
        run: |
          set -e
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Impacchetta in .ipa
        run: |
          set -e
          APP_PATH=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Trovato: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Nuvio-unsigned.ipa Payload

      - name: Leggi bundle ID e versione
        run: |
          PLIST=$(find Payload -maxdepth 2 -name "Info.plist" | head -n 1)
          echo "--- dati per Apple Developer e manifest.plist ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"         "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion"            "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion"           "$PLIST"
          echo "--- estensioni presenti (se vuoto, nessuna) ---"
          ls Payload/*.app/PlugIns 2>/dev/null || echo "nessuna"

      - name: Pubblica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-unsigned-ipa
          path: Nuvio-unsigned.ipa
          retention-days: 30
