name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout senza submoduli
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Scarica MPVKit a mano
        run: |
          rm -rf MPVKit
          git clone https://github.com/NuvioMedia/MPVKit.git MPVKit
          cd MPVKit
          git checkout 20afe97c34e46fce08a3794e2afa64613ea62794

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ambiente
        run: |
          xcodebuild -version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # ---- da qui: diagnostica della parte Kotlin ----

      - name: Quali task Gradle esistono per il framework iOS
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :composeApp:tasks --all 2>&1 | grep -i -E "framework|xcode|ios" || echo "nessun task trovato"

      - name: Prova a costruire il framework Kotlin da solo
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :composeApp:linkReleaseFrameworkIosArm64 2>&1 | tee gradle.log

      - name: Errori di Gradle
        if: always()
        run: |
          if [ -f gradle.log ]; then
            echo "=============== COSA E' ANDATO STORTO ==============="
            grep -n -A 20 "What went wrong" gradle.log | head -n 60 || true
            echo "=============== ALTRI ERRORI ==============="
            grep -n -E "^e: |FAILURE:|Caused by|Could not |Unresolved reference" gradle.log | head -n 40 || true
            echo "=============== ULTIME 40 RIGHE ==============="
            tail -n 40 gradle.log
          else
            echo "gradle.log non creato"
          fi

      # ---- da qui: la build vera ----

      - name: Compila senza firma
        continue-on-error: true
        env:
          NUVIO_IOS_DISTRIBUTION: full
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Errori della compilazione iOS
        if: always()
        run: |
          echo "=============== RIGHE DI ERRORE ==============="
          grep -n -E "error:|^e: |FAILURE:|What went wrong|Caused by" build.log | tail -n 50 || echo "nessuna"
          echo "=============== INTORNO ALLO SCRIPT KOTLIN ==============="
          grep -n -B 5 -A 40 "Compile Kotlin Framework" build.log | tail -n 120 || true

      - name: Salva i log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            gradle.log
          retention-days: 7
          if-no-files-found: warn

      - name: Impacchetta in .ipa
        run: |
          set -e
          APP_PATH=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Trovato: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Nuvio-unsigned.ipa Payload

      - name: Leggi bundle ID e versione
        run: |
          PLIST=$(find Payload -maxdepth 2 -name "Info.plist" | head -n 1)
          echo "--- dati per Apple Developer e manifest.plist ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"         "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion"            "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion"           "$PLIST"

      - name: Pubblica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-unsigned-ipa
          path: Nuvio-unsigned.ipa
          retention-days: 30
